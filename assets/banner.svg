<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Clarity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.5" stop-color="#0d0d10"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" fill="url(#bg)"/>
  <g opacity="0.5">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#ffffff" stroke-opacity="0.03"/>
    <line x1="0" y1="340" x2="1200" y2="340" stroke="#ffffff" stroke-opacity="0.03"/>
    <line x1="0" y1="0" x2="0" y2="340" stroke="#ffffff" stroke-opacity="0.03"/>
    <line x1="1200" y1="0" x2="1200" y2="340" stroke="#ffffff" stroke-opacity="0.03"/>
  </g>
  <circle cx="600" cy="170" r="200" fill="url(#glow)"/>
  <g transform="translate(600 170)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      <ellipse rx="240" ry="84" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
      <circle cx="240" cy="0" r="3.5" fill="#ffffff" opacity="0.75"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="17s" repeatCount="indefinite"/>
      <ellipse rx="172" ry="62" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
      <circle cx="172" cy="0" r="3" fill="#ffffff" opacity="0.85"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
      <ellipse rx="310" ry="112" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
      <circle cx="310" cy="0" r="2.5" fill="#ffffff" opacity="0.45"/>
    </g>
    <circle r="30" fill="#000000"/>
    <circle r="30" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle r="8" fill="#ffffff">
      <animate attributeName="r" values="7;9;7" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="600" y="286" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="9" fill="url(#titleGrad)">CLARITY</text>
  <text x="600" y="310" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" letter-spacing="3" fill="#ffffff" fill-opacity="0.32">UNDERSTAND ANYTHING, AT YOUR LEVEL</text>
  <rect x="0" y="0" width="1200" height="340" fill="url(#sweep)" opacity="0.35" pointer-events="none"/>
</svg>
